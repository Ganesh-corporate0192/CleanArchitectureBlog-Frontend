<div class="blog-list-container">

  <!-- Header -->
  <div class="header">

    <h2>Blog List</h2>

    <button
      mat-raised-button
      color="primary"
      routerLink="/create">

      <mat-icon>add</mat-icon>
      Create Blog

    </button>

  </div>


  <!-- Loading Indicator -->
<div *ngIf="loading" class="loader-container">
  <kendo-loader type="infinite-spinner"></kendo-loader>
</div>

 <!-- Blog Grid -->
  <div class="blog-grid" *ngIf="!loading">

    <kendo-card
      class="blog-card"
      *ngFor="let blog of blogs"
    >

      <!-- Blog Image -->
      <img
        *ngIf="blog.imageUrl"
        [src]="blog.imageUrl"
        alt="Blog image"
        class="blog-image"
      />

      <!-- Blog Content -->
      <kendo-card-body>

        <h3 class="blog-title">
          {{ blog.name }}
        </h3>

        <p class="description">
          {{ blog.description }}
        </p>

        <p class="author">
          <strong>Author:</strong> {{ blog.author }}
        </p>

      </kendo-card-body>


      <!-- Action Buttons -->
      <kendo-card-actions>

        <button
          kendoButton
          themeColor="primary"
          fillMode="outline"
          [routerLink]="['/edit', blog.id]">

          <mat-icon>edit</mat-icon>
          Edit

        </button>

        <button
          kendoButton
          themeColor="error"
          fillMode="outline"
          (click)="delete(blog.id!)">

          <mat-icon>delete</mat-icon>
          Delete

        </button>

      </kendo-card-actions>

    </kendo-card>

  </div>

</div>
