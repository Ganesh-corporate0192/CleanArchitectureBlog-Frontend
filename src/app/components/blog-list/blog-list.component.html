<mat-drawer-container class="drawer-container">

  <!-- MAIN CONTENT -->
  <mat-drawer-content>

    <div class="blog-list-container">

      <!-- Header -->
      <div class="header">
        <mat-form-field appearance="outline" style="width:300px; margin-top:10px;">
          <mat-label>Search Blog</mat-label>

          <input
            matInput
            placeholder="Search by name or author..."
            (input)="onSearchChange($any($event.target).value)"
          />

          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <h2 *ngIf="!loading() && filteredBlogs().length > 0">Blog List</h2>

        <button
          mat-raised-button
          color="primary"
          (click)="createNewBlog()">

          <mat-icon>add</mat-icon>
          Create Blog

        </button>
      </div>

      <!-- Save + Delete Info -->
      <div
        *ngIf="editedBlogs().length > 0 || deletedBlogIds().length > 0"
        style="margin:15px 0; display:flex; justify-content:space-between; align-items:center;">

        <div *ngIf="deletedBlogIds().length > 0" style="color:red;">
          {{ deletedBlogIds().length }} blog(s) marked for deletion 🗑️
        </div>

        <button
          mat-raised-button
          color="accent"
          (click)="saveAll()">

          Save All Changes

        </button>
      </div>

      <!-- Loader -->
      <div *ngIf="loading()" class="loader-container">
        <kendo-loader type="infinite-spinner"></kendo-loader>
      </div>

      <!-- No Data -->
      <div
        *ngIf="!loading() && filteredBlogs().length === 0"
        class="no-data-container">

        <mat-card class="no-data-card">
          <mat-icon class="no-data-icon">search_off</mat-icon>
          <h2>No Blogs Found</h2>
          <p>Try adjusting your search or create a new blog.</p>
        </mat-card>
      </div>

      <!-- Blog Grid -->
      <div class="blog-grid" *ngIf="!loading() && filteredBlogs().length > 0">

        <kendo-card
          class="blog-card"
          *ngFor="let blog of paginatedBlogs()"
          [class.edited-card]="editedBlogs().some(b => isSameBlog(b, blog))">

          <!-- New Badge -->
          <div *ngIf="(blog.id ?? 0) === 0" class="unsaved-badge">
            New
          </div>

          <!-- Image -->
          <img
            *ngIf="blog.imageUrl"
            [src]="blog.imageUrl"
            alt="Blog image"
            class="blog-image"
            [class.edited-field]="(blog.id ?? 0) > 0 && isFieldEdited(blog.id!, 'imageUrl')"
          />

          <kendo-card-body>

            <h3
              class="blog-title"
              [class.edited-field]="(blog.id ?? 0) > 0 && isFieldEdited(blog.id!, 'name')">
              {{ blog.name }}
            </h3>

            <p
              class="description"
              [class.edited-field]="(blog.id ?? 0) > 0 && isFieldEdited(blog.id!, 'description')">
              {{ blog.description }}
            </p>

            <p
              class="author"
              [class.edited-field]="(blog.id ?? 0) > 0 && isFieldEdited(blog.id!, 'author')">
              <strong>Author:</strong> {{ blog.author }}
            </p>

          </kendo-card-body>

          <kendo-card-actions>

            <button
              kendoButton
              themeColor="primary"
              fillMode="outline"
              (click)="startEdit(blog)">
              <mat-icon>edit</mat-icon>
              Edit
            </button>

            <button
              kendoButton
              themeColor="error"
              fillMode="outline"
              (click)="delete(blog)">
              <mat-icon>delete</mat-icon>
              Delete
            </button>

          </kendo-card-actions>

        </kendo-card>

      </div>

      <!-- Pagination -->
      <mat-paginator
        *ngIf="!loading() && filteredBlogs().length > 0"
        [length]="filteredBlogs().length"
        [pageSize]="pageSize()"
        [pageIndex]="pageIndex()"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>

    </div>

  </mat-drawer-content>

  <!-- Edit / Create Drawer -->
  <mat-drawer
    mode="over"
    position="end"
    [opened]="drawerOpen()"
    (closedStart)="onDrawerClosed()"
    style="width:420px;padding:20px;">

    <div class="drawer-scroll-container">
      <app-blog-edit-drawer
        [blog]="selectedBlog()"
        [imageUrlError]="imageUrlError()"
        [hasChanges]="hasChanges()"
        (save)="addToSaveListFromDrawer()"
        (cancel)="cancelEdit()"
        (validate)="validateImageUrl()"
        (imageError)="onImageError()">
      </app-blog-edit-drawer>
    </div>
  </mat-drawer>

</mat-drawer-container>
